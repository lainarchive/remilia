watch_stylesheet: true
watch_config: true
debug: false

glazewm:
  start_command: "glazewm.exe start"
  stop_command: "glazewm.exe command wm-exit"
  reload_command: "glazewm.exe command wm-exit && glazewm.exe start"

bars:
  primary-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: true

    blur_effect:
      enabled: false
      acrylic: false
      dark_mode: false
      round_corners: true

    window_flags:
      always_on_top: false
      windows_app_bar: true
      hide_on_fullscreen: true

    dimensions:
      width: "100%"
      height: 34

    padding:
      top: 10
      left: 12
      bottom: 0
      right: 12

    widgets:
      left:
        [
          "win_button",
          "remilia_ornaments",
          "glazewm_workspaces",
          "glazewm_tiling_direction",
          "lines",
          "active_window",
          "clock",
        ]

      center:
        [
          "taskbar",
        ]

      right:
        [
          "media",
          "cava",
          "volume",
          "lines",
          "cpu",
          "memory",
          "traffic",
          "wifi",
          "lines",
          "systray",
          "wallpapers",
          "power_menu"
        ]

widgets:

  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "家"

      menu_list:
        - { title: "Home", path: "~" }
        - { title: "Downloads", path: "C:\\Users\\Darren\\Downloads" }
        - { title: "Documents", path: "C:\\Users\\Darren\\Documents" }
        - { title: "Pictures", path: "C:\\Users\\Darren\\Pictures" }
        - { title: "Videos", path: "C:\\Users\\Darren\\Videos" }

      system_menu: false
      power_menu: false
      blur: false
      round_corners: false
      round_corners_type: "normal"
      distance: 5
      container_padding:
        top: 0
        left: 0
        bottom: 0
        right: 0
      alignment: "left"
      direction: "down"

      menu_labels:
        shutdown: "Shutdown"
        restart: "Restart"
        logout: "Logout"
        lock: "Lock"
        sleep: "Sleep"
        system: "System Settings"
        about: "About This PC"
        task_manager: "Task Manager"


  # =========================
  # REMILIA ORNAMENT RAIL
  # =========================

  remilia_ornaments:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      class_name: "remilia-ornaments"
      image_icon_size: 18
      tooltip: true
      app_list:
        - { icon: "C:\\Users\\User\\remilia\\assets\\yasb\\ornaments\\bat.svg", launch: "cmd.exe /c exit", name: "Bat Crest" }
        - { icon: "C:\\Users\\User\\remilia\\assets\\yasb\\ornaments\\rose.svg", launch: "cmd.exe /c exit", name: "Heraldic Rose" }
        - { icon: "C:\\Users\\User\\remilia\\assets\\yasb\\ornaments\\fleur.svg", launch: "cmd.exe /c exit", name: "Gothic Fleur" }


  # =========================
  # GLAZEWM WORKSPACES
  # =========================

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_if_offline: false

      monitor_exclusive: true
      enable_scroll_switching: true
      reverse_scroll_direction: false

      populated_label: "{name}"
      empty_label: "{name}"
      active_populated_label: "{name}"
      active_empty_label: "{name}"
      focused_populated_label: "{name}"
      focused_empty_label: "{name}"

      app_icons:
        enabled_populated: false
        enabled_active: false
        enabled_focused: false
        size: 12
        max_icons: 0
        hide_label: false
        hide_duplicates: false
        hide_floating: false


  # =========================
  # GLAZEWM TILING DIRECTION
  # =========================

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"


  weather:
    type: "yasb.weather.WeatherWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "<span>{icon}</span> {location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      api_key: "EnterAPIKeyHere"
      update_interval: 600
      hide_decimal: true
      location: "Irkutsk"

      callbacks:
        on_left: "toggle_label"

      icons:
        sunnyDay: "\udb81\udd99"
        clearNight: "\udb81\udd99"
        cloudyDay: "\udb81\udd99"
        cloudyNight: "\udb81\udd99"
        rainyDay: "\udb81\udd99"
        rainyNight: "\udb81\udd99"
        snowyIcyDay: "\udb81\udd99"
        snowyIcyNight: "\udb81\udd99"
        blizzardDay: "\udb81\udd99"
        default: "\udb81\udd99"


  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "♫ {title}"
      label_alt: "{artist}  ·  {title}"

      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"

      max_field_size:
        label: 24
        label_alt: 32

      show_thumbnail: false
      controls_only: false
      controls_left: true
      hide_empty: false
      thumbnail_alpha: 250
      thumbnail_padding: 8
      thumbnail_corner_radius: 10

      icons:
        prev_track: ""
        next_track: ""
        play: "<span>\uf001</span>"
        pause: "<span>\uf001</span>"

      media_menu:
        blur: false
        round_corners: true
        round_corners_type: "round"
        alignment: "center"
        direction: "down"
        offset_top: 5
        offset_left: 0
        thumbnail_size: 100
        thumbnail_corner_radius: 10
        max_title_size: 45
        max_artist_size: 50
        show_source: true

      media_menu_icons:
        play: "\ue768"
        pause: "\ue769"
        prev_track: "\ue892"
        next_track: "\ue893"


  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]}"
      label_no_window: ""
      label_icon: false
      label_icon_size: 14
      max_length: 28
      max_length_ellipsis: "..."
      monitor_exclusive: false


  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%d %b}  ·  {%H:%M}"
      label_alt: "{%A, %d %B %Y %H:%M}"
      tooltip: false
      timezones: []

      calendar:
        alignment: "center"
        direction: "down"
        blur: false
        round_corners: true
        round_corners_type: "normal"


  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "CPU {info[percent][total]}%"
      label_alt: "{info[freq][current]} MHz"
      class_name: "system-stat-widget"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: false
        graph_history_size: 45


  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "RAM {virtual_mem_percent}%"
      label_alt: "RAM {virtual_mem_percent}% · SWAP {swap_mem_percent}%"
      class_name: "system-stat-widget"
      update_interval: 5000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"


  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "↓ {download_speed}  ↑ {upload_speed}"
      label_alt: "↓ {download_speed} · ↑ {upload_speed}"
      class_name: "network-widget"
      update_interval: 1000
      speed_unit: "bytes"
      hide_if_offline: true
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"


  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "{wifi_icon}"
      label_alt: "{wifi_icon} {wifi_name}"
      class_name: "network-widget"
      update_interval: 5000

      wifi_icons:
        - "\udb82\udd2e"
        - "\udb82\udd1f"
        - "\udb82\udd22"
        - "\udb82\udd25"
        - "\udb82\udd28"

      callbacks:
        on_middle: "do_nothing"
        on_right: "exec cmd.exe /c start ms-settings:network"


  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{volume}"

      volume_icons:
        - "\ueee8"
        - "\uf026"
        - "\uf027"
        - "\uf027"
        - "\uf028"

      audio_menu:
        direction: "down"

      callbacks:
        on_right: "exec cmd.exe /c start ms-settings:sound"


  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span>\uf473</span>"
      label_alt: "<span>\uf473</span>"
      update_interval: 60

      group_label:
        volume_labels: ["C", "D", "E", "F"]
        show_label_name: false
        blur: true
        round_corners: true
        round_corners_type: "small"
        border_color: "System"
        alignment: "center"
        direction: "down"
        distance: 6

      callbacks:
        on_left: "toggle_group"
        on_middle: "toggle_label"
        on_right: "exec explorer C:\\\\"


  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "✦"
      image_path: "C:\\Users\\MrDLi\\iCloudDrive\\Wallpapers\\Themes\\YLIA"
      change_automatically: false
      update_interval: 60

      animation:
        enabled: true
        type: "fadeInOut"
        duration: 200

      gallery:
        enabled: true
        blur: false
        image_width: 300
        image_per_page: 6
        show_buttons: true
        orientation: "portrait"
        image_spacing: 11
        lazy_load: true
        lazy_load_delay: 10
        lazy_load_fadein: 200
        image_corner_radius: 4
        enable_cache: true


  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: true
      blur: false
      blur_background: true
      animation_duration: 250
      button_row: 1

      buttons:
        signout: ["", "Sign out"]
        shutdown: ["", "Shut Down"]
        restart: ["", "Restart"]
        hibernate: ["", "Hibernate"]
        cancel: ["", "Cancel"]


  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      gradient: 0
      reverse: 0
      sensitivity: 90
      bars_number: 12
      bar_spacing: 2
      bar_width: 4
      foreground: "#9a3b59"
      sleep_timer: 0
      hide_empty: true

      container_padding:
        top: 0
        left: 2
        bottom: 0
        right: 0


  github:
    type: "yasb.github.GithubWidget"
    options:
      label: "<span>\ueba1</span>"
      label_alt: "Notifications {data}"
      token: env
      max_notification: 20
      only_unread: false
      max_field_size: 54
      update_interval: 300

      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        distance: 6


  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\ue8a9"
      label_expanded: "\ue76c"
      icon_size: 16
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_volume: false
      show_network: false

      btn_shadow:
        enabled: true
        color: "black"
        radius: 3
        offset: [1, 1]


  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 0
      tooltip: true
      show_only_visible: true
      strict_filtering: true
      monitor_exclusive: true

      animation:
        enabled: true

      preview:
        enabled: true
        width: 240
        delay: 400
        padding: 8
        margin: 8

      title_label:
        enabled: true
        show: "always"
        min_length: 6
        max_length: 30

      ignore_apps:
        processes: []
        titles: []
        classes: []


  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "│"
      label_alt: "│"
      class_name: "separator-widget"

      callbacks:
        on_left: "do_nothing"


  win_button:
    type: "yasb.custom.CustomWidget"
    options:
      label: "家"
      label_alt: "家"
      class_name: "system-widget"

      callbacks:
        on_left: "exec start_menu"
